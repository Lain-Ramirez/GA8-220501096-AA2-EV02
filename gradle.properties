# Ajustes de Gradle para todo el proyecto.
# Android Studio puede sobrescribirlos con los suyos.

# Memoria del proceso que compila y codificacion de los archivos fuente.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# La cache de configuracion se salta la fase de configuracion cuando nada que la afecte cambio.
org.gradle.configuration-cache=true

# Estilo de codigo de Kotlin.
kotlin.code.style=official
